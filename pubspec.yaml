name: recipe_finder
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: SofiaSans
      fonts:
        - asset: assets/fonts/SofiaSans-400.ttf
        - asset: assets/fonts/SofiaSans-600.ttf
          weight: 600
        - asset: assets/fonts/SofiaSans-700.ttf
          weight: 700
        - asset: assets/fonts/SofiaSans-800.ttf
          weight: 800
